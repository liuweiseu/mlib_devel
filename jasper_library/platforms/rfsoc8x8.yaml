# RFSoC8x8 platform description (xczu47dr-ffve1156-2-e).
#
# Bootstrapped from rfsoc4x2.yaml; `fpga`, the rfdc tile clocking, the
# 100 GbE configuration and all pin locations have been updated for the
# RFSoC8x8 board. Pins were checked against the xczu47dr-ffve1156 package in
# Vivado 2021.1.
name: rfsoc8x8
manufacturer: Xilinx
fpga: xczu47dr-ffve1156-2-e
family: rfsoc
config_voltage: 1.8
cfgbvs: GND
backend_target: vivado
mmbus_architecture: AXI4-Lite
mmbus_base_address: 0xA0000000
# How to address each 32-bit (i.e. 4 indicates byte-addressable)
mmbus_address_alignment: 4
sources: []
constraints: []

rfdc:
  # gen3 devices can internally route their input refclk or the output of the RFPLL
  # as the sample clock for adjacent tiles. See PG269.
  #
  # `*_clk_src` is a tile index: 0-3 = ADC tiles 224-227, 4-7 = DAC tiles 228-231.
  # For gen1 and gen2 devices the `adc_clk_src` is the same as the tile index.
  # For gen3 devices (this board) rfdc.py takes the clock source from the rfdc
  # block mask (t<N>_has_adc_clk / t<N>_adc_clk_src), not from this section;
  # the values below document the RFSoC8x8 board clocking.
  #
  # RFSoC8x8 board: sample clocks are wired to tiles 225, 227 and 228.
  # All ADC tiles are clocked from tile 225; all DAC tiles from tile 228
  # (the only DAC tile with a clock input).
  # ADC
  tile224:
    has_adc_clk: False
    adc_clk_src: 1
  tile225:
    has_adc_clk: True
    adc_clk_src: 1
  tile226:
    has_adc_clk: False
    adc_clk_src: 1
  tile227:
    has_adc_clk: True
    adc_clk_src: 1
  # DAC
  tile228:
    has_dac_clk: True
    dac_clk_src: 4
  tile229:
    has_dac_clk: False
    dac_clk_src: 4
  tile230:
    has_dac_clk: False
    dac_clk_src: 4
  tile231:
    has_dac_clk: False
    dac_clk_src: 4

onehundredgbe:
  refclk_freq_str: "156.25"
  include_rs_fec: 1
  ncommon: 1
  management_interface: [modprsl_ls, intl_ls]
  # RFSoC8x8 has two 100GbE ports. One entry per port (index = 100GbE block
  # port number). xczu47dr-ffve1156 has CMACE4_X0Y0 (clock region X0Y3) and
  # CMACE4_X0Y1 (clock region X0Y6); only GTY quads 128 (X0Y4) and 129 (X0Y5)
  # are bonded out in this package.
  # Note: onehundredgbe_rfsoc reads but does not apply cmac_loc; Vivado places
  # the CMAC next to the GTs chosen by the qsfp_mgt_* pin constraints.
  cmac_loc:
    - CMACE4_X0Y0
    - CMACE4_X0Y1


provides:
  - adc_clk
  - axil_clk
  - sysref_in


pins:
  # 100 MHz differential clock on HD bank 88 (IO_L6P/N_HDGC_88, VCCO = 3.3 V).
  # HD banks do not support the LVDS standard, so LVDS_25 (input) is used. Not referenced by the
  # toolflow code; kept as board documentation.
  clk_100_p:
    iostd: LVDS_25
    loc: G12
  clk_100_n:
    iostd: LVDS_25
    loc: F12
  # PL DDR4 reference clock on HP bank 66 (IO_L13P/N_T2L_N0/N1_GC_QBC_66,
  # VCCO = 1.2 V).
  # Not referenced by the toolflow code; kept as board documentation.
  ddr_clk_p:
    iostd: DIFF_SSTL12
    loc: AL9
  ddr_clk_n:
    iostd: DIFF_SSTL12
    loc: AM9
  # PPS input on HD bank 89 (IO_L6P_HDGC_AD6P_89, VCCO = 3.3 V). Use it from a
  # gpio block with io_group 'custom' and custom group name 'pps_in'.
  pps_in:
    iostd: LVCMOS33
    loc: E10

# RFDC
  # RF SYSREF on the dedicated pins SYSREF_P/N_228 (the only SYSREF pair on
  # xczu47dr-ffve1156). Not constrained by the toolflow: rfdc.py creates the
  # sysref_in_p/n ports and Vivado places them on these dedicated pins.
  sysref_p:
    loc: N5
  sysref_n:
    loc: N4

  # PL copy of SYSREF for MTS on HP bank 66 (IO_L12P/N_T1U_N10/N11_GC_66,
  # VCCO = 1.2 V: LVDS input only, no internal DIFF_TERM).
  # Used by rfdc.py (mts_pl_sysref_sync IBUFDS + PortConstraint on pl_sysref_p)
  # when MTS is enabled.
  pl_sysref_p:
    iostd: LVDS
    loc: AM10
  pl_sysref_n:
    iostd: LVDS
    loc: AN10

  # PL reference clock (MMCM input for adc_clk) on HP bank 66 GC pair
  # IO_L11P/N_T1U_N8/N9_GC_66 (P = AP11, N = AP10), clock region X4Y2 next to
  # MMCM_X0Y2. VCCO = 1.2 V: LVDS input only, no internal DIFF_TERM. Its
  # frequency must match the platform block's `pl_clk_rate`.
  pl_clk_p:
    iostd: LVDS
    loc: AP11
  pl_clk_n:
    iostd: LVDS
    loc: AP10

  # Do not instantiate clock buffer inputs in the user design, part of the RF-ADC [PG269 v2.4 pg.153]
  # ADC tile 225 sample clock (dedicated ADC_CLK_P/N_225), the clock source for
  # all ADC tiles. Not constrained by the toolflow: rfdc.py creates the
  # adc1_clk_p/n ports and Vivado places them on these dedicated pins.
  adc_clk_225_p:
    loc: AB5
  adc_clk_225_n:
    loc: AB4


# 100 GbE
  # Two QSFP28 ports. List index = 100GbE block port number:
  #   port 0 = QSFP1 -> GTY quad 128 (CMACE4_X0Y0)
  #   port 1 = QSFP2 -> GTY quad 129 (CMACE4_X0Y1)
  # Each QSFP uses MGTREFCLK1 (156.25 MHz) of its quad. QSFP lanes 0-3 map to
  # GT channels 0-3 in order, no P/N swaps. mgt tx/rx lists hold 4 lanes per
  # port (port 0: entries 0-3, port 1: entries 4-7).
  qsfp_mgt_ref_clk_p:
    loc: [K28, F28]   # MGTREFCLK1P_128, MGTREFCLK1P_129
  qsfp_mgt_ref_clk_n:
    loc: [K29, F29]   # MGTREFCLK1N_128, MGTREFCLK1N_129
  qsfp_mgt_tx_p:
    #      quad 128 ch0-3        quad 129 ch0-3
    loc: [N30, L30, J30, G30,  E30, D28, C30, B28]
  qsfp_mgt_tx_n:
    loc: [N31, L31, J31, G31,  E31, D29, C31, B29]
  qsfp_mgt_rx_p:
    loc: [P33, M33, K33, H33,  F33, D33, B33, A31]
  qsfp_mgt_rx_n:
    loc: [P34, M34, K34, H34,  F34, D34, B34, A32]

  # QSFP low-speed management signals, [QSFP1, QSFP2], all on HD bank 89
  # (VCCO = 3.3 V).
  qsfp_modsell_ls:
    iostd: LVCMOS33
    loc: [J12, K11]
  qsfp_resetl_ls:
    iostd: LVCMOS33
    loc: [K12, H9]
  qsfp_modprsl_ls:
    iostd: LVCMOS33
    loc: [H11, H10]
  qsfp_intl_ls:
    iostd: LVCMOS33
    loc: [J11, G10]
  qsfp_lpmode_ls:
    iostd: LVCMOS33
    loc: [K10, G11]

  # LED0-LED7, all on HP bank 66 (VCCO = 1.2 V).
  # NOTE: LED7 (AM5) is also driven by mmcm_locked (yellow_blocks/rfsoc8x8.py),
  # so a gpio block on the led group must not use bit 7.
  led:
    drive_strength: 8 #HP banks don't support the default of 12
    iostd: LVCMOS12
    loc: [AP5, AP8, AP6, AM6, AP7, AM7, AM8, AM5]


  # LMK04828 SPI, driven by PS SPI0 over EMIO (zynq_emio child of
  # yellow_blocks/rfsoc8x8.py). HD bank 89 (VCCO = 3.3 V).
  lmk_spi_sclk:
    iostd: LVCMOS33
    loc: D11
  lmk_spi_mosi:
    iostd: LVCMOS33
    loc: B10
  lmk_spi_miso:
    iostd: LVCMOS33
    loc: D9
  lmk_spi_cs_n:
    iostd: LVCMOS33
    loc: C11
  # LMK04828 control, PS GPIO EMIO bits 0-3 via IOBUFs:
  # [REF_SEL0, REF_SEL1, RESET, SYNC]. HD bank 89 (VCCO = 3.3 V).
  lmk_ctrl:
    iostd: LVCMOS33
    loc: [C10, C9, E11, E9]

  # GPIO0-GPIO7, all on HD bank 88 (VCCO = 3.3 V).
  gpio:
    iostd: LVCMOS33
    loc: [B12, A14, A13, C14, F14, B13, A12, C13]
