# RFSoC8x8 platform description.
#
# NOTE: this file was bootstrapped from rfsoc4x2.yaml. Only `name`, `fpga`,
# the rfdc tile clocking and the 100 GbE (onehundredgbe + qsfp_* pins) have
# been changed so far. `provides` and every other pin location are still the RFSoC4x2
# (xczu48dr-ffvg1517) values. The xczu47dr-ffve1156 package has a different
# pinout, so all `loc` entries must be replaced with the RFSoC8x8 board's
# real pin assignments before a design for this platform can be implemented.
name: rfsoc8x8
manufacturer: Xilinx
fpga: xczu47dr-ffve1156-2-e
family: rfsoc
config_voltage: 1.8
cfgbvs: GND
backend_target: vivado
mmbus_architecture: AXI4-Lite
mmbus_base_address: 0xA0000000
# How to address each 32-bit (i.e. 4 indicates byte-addressable)
mmbus_address_alignment: 4
sources: []
constraints: []

rfdc:
  # gen3 devices can internally route their input refclk or the output of the RFPLL
  # as the sample clock for adjacent tiles. See PG269.
  #
  # `*_clk_src` is a tile index: 0-3 = ADC tiles 224-227, 4-7 = DAC tiles 228-231.
  # For gen1 and gen2 devices the `adc_clk_src` is the same as the tile index.
  # For gen3 devices (this board) rfdc.py takes the clock source from the rfdc
  # block mask (t<N>_has_adc_clk / t<N>_adc_clk_src), not from this section;
  # the values below document the RFSoC8x8 board clocking.
  #
  # RFSoC8x8 board: sample clocks are wired to tiles 225, 227 and 228.
  # All ADC tiles are clocked from tile 225; all DAC tiles from tile 228
  # (the only DAC tile with a clock input).
  # ADC
  tile224:
    has_adc_clk: False
    adc_clk_src: 1
  tile225:
    has_adc_clk: True
    adc_clk_src: 1
  tile226:
    has_adc_clk: False
    adc_clk_src: 1
  tile227:
    has_adc_clk: True
    adc_clk_src: 1
  # DAC
  tile228:
    has_dac_clk: True
    dac_clk_src: 4
  tile229:
    has_dac_clk: False
    dac_clk_src: 4
  tile230:
    has_dac_clk: False
    dac_clk_src: 4
  tile231:
    has_dac_clk: False
    dac_clk_src: 4

onehundredgbe:
  refclk_freq_str: "156.25"
  include_rs_fec: 1
  ncommon: 1
  management_interface: [modprsl_ls, intl_ls]
  # RFSoC8x8 has two 100GbE ports. One entry per port (index = 100GbE block
  # port number). xczu47dr-ffve1156 has CMACE4_X0Y0 (clock region X0Y3) and
  # CMACE4_X0Y1 (clock region X0Y6); only GTY quads 128 (X0Y4) and 129 (X0Y5)
  # are bonded out in this package.
  # Note: onehundredgbe_rfsoc reads but does not apply cmac_loc; Vivado places
  # the CMAC next to the GTs chosen by the qsfp_mgt_* pin constraints.
  cmac_loc:
    - CMACE4_X0Y0
    - CMACE4_X0Y1


provides:
  - adc_clk
  - axil_clk
  - sysref_in


pins:
  clk_100_p:
    iostd: LVDS
    loc: AM15
  clk_100_n:
    iostd: LVDS
    loc: AN15
  ddr_clk_p:
    iostd: DIFF_SSTL12
    loc: G12
  ddr_clk_n:
    iostd: DIFF_SSTL12
    loc: G13
  qsfp_refclk_n:    # 156.25 MHz
    iostd: LVDS
    loc: AL17
  qsfp_refclk_p:    # 156.25 MHz
    iostd: LVDS
    loc: AM17
  irig_trig:
    iostd: LVCMOS18
    loc: AH13
  irig_comp:
    iostd: LVCMOS18
    loc: AJ13

# RFDC
  sysref_p:
    loc: D2
  sysref_n:
    loc: D1

  # `SYSREF_FPGA_P/N` on HP bank 66, VCCO is 1.8 but LVDS_25 still
  # supported, see UG571 SelectIO Resources table 3-2 and DS926 tables 23, 24,
  # and 2
  pl_sysref_p:
    iostd: LVDS
    loc: AP18
  pl_sysref_n:
    iostd: LVDS
    loc: AR18

  # `FPGA_REFCLK_IN_P/N` on HP bank 65
  pl_clk_p:
    iostd: LVDS
    loc: AN11
  pl_clk_n:
    iostd: LVDS
    loc: AP11

  # Do not instantiate clock buffer inputs in the user design, part of the RF-ADC [PG269 v2.4 pg.153]
  adc_clk_224_p:
    loc: BA3
  adc_clk_224_n:
    loc: BB3


# 100 GbE
  # Two QSFP28 ports. List index = 100GbE block port number:
  #   port 0 = QSFP1 -> GTY quad 128 (CMACE4_X0Y0)
  #   port 1 = QSFP2 -> GTY quad 129 (CMACE4_X0Y1)
  # Each QSFP uses MGTREFCLK1 (156.25 MHz) of its quad. QSFP lanes 0-3 map to
  # GT channels 0-3 in order, no P/N swaps. mgt tx/rx lists hold 4 lanes per
  # port (port 0: entries 0-3, port 1: entries 4-7).
  qsfp_mgt_ref_clk_p:
    loc: [K28, F28]   # MGTREFCLK1P_128, MGTREFCLK1P_129
  qsfp_mgt_ref_clk_n:
    loc: [K29, F29]   # MGTREFCLK1N_128, MGTREFCLK1N_129
  qsfp_mgt_tx_p:
    #      quad 128 ch0-3        quad 129 ch0-3
    loc: [N30, L30, J30, G30,  E30, D28, C30, B28]
  qsfp_mgt_tx_n:
    loc: [N31, L31, J31, G31,  E31, D29, C31, B29]
  qsfp_mgt_rx_p:
    loc: [P33, M33, K33, H33,  F33, D33, B33, A31]
  qsfp_mgt_rx_n:
    loc: [P34, M34, K34, H34,  F34, D34, B34, A32]

  # QSFP low-speed management signals, [QSFP1, QSFP2], all on HD bank 89
  # (VCCO = 3.3 V).
  qsfp_modsell_ls:
    iostd: LVCMOS33
    loc: [J12, K11]
  qsfp_resetl_ls:
    iostd: LVCMOS33
    loc: [K12, H9]
  qsfp_modprsl_ls:
    iostd: LVCMOS33
    loc: [H11, H10]
  qsfp_intl_ls:
    iostd: LVCMOS33
    loc: [J11, G10]
  qsfp_lpmode_ls:
    iostd: LVCMOS33
    loc: [K10, G11]

  led:
    drive_strength: 8 #HP banks don't support the default of 12
    iostd: LVCMOS18
    # [USER_LED(4), RGB_0(3), RGB_1(3)]
    loc: [AR11, AW10, AT11, AU10, AM8, AM7, AN8, AR12, AP8, AT10]


  gpio:
    iostd: LVCMOS18
    loc:
      # switches
      - AN13 # SW0
      - AU12 # SW1
      - AW11 # SW2
      - AV11 # SW3
      # buttons
      - AN12 # User Reset
      - AV12 # PB0
      - AV10 # PB1
      - AW9  # PB2
      - AT12 # PB3


  pmod:
    iostd: LVCMOS18
    loc: [AF16, AG17, AJ16, AK17, AF15, AF17, AH17, AK16, AW13, AR13, AU13,
          AV13, AU15, AP14, AT15, AU14, AW16, AW15, AW14, AR16, AV16, AT16]


  # The IO standard is determined by the setting of VCCPSYZYGY
  # modify the iostd lines below to reflect the actual standard
  syzygy_p2c_clk_p:
    iostd: LVCMOS18
    loc:
      - AV6
  syzygy_p2c_clk_n:
    iostd: LVCMOS18
    loc:
      - B10
  syzygy_c2p_clk_p:
    iostd: LVCMOS18
    loc:
      - B9
  syzygy_c2p_clk_n:
    iostd: LVCMOS18
    loc:
      - AV5
  syzygy_d_p:
    iostd: LVCMOS18
    # D0-D7
    loc: [AU2, A7, AV3, C8, AW4, E9, AT7, F6]
  syzygy_d_n:
    iostd: LVCMOS18
    # D0-D7
    loc: [AU1, A6, AV2, C7, AW3, E8, AT6, E6]
  syzygy_s:
    iostd: LVCMOS18
    # S16-S27
    loc: [B8, AR6, D6, AR7, C6, AU7, B5, AV7, A5, AU8, C5, AV8]
